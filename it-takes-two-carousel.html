<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>It Takes Two — Homo Ludens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14181a;
    --panel: #1f2528;
    --panel-edge: #2a3134;
    --ink: #edeae2;
    --ink-dim: #9aa3a6;
    --amber: #e8a33d;
    --teal: #4fa3a3;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
  }

  .wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  header {
    flex: 0 0 auto;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 22px clamp(20px, 4vw, 44px) 14px;
    border-bottom: 1px solid var(--panel-edge);
  }
  header h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(20px, 2.4vw, 28px);
    letter-spacing: 0.01em;
    margin: 0;
  }
  header h1 span {
    color: var(--teal);
  }
  .counter {
    font-variant-numeric: tabular-nums;
    color: var(--ink-dim);
    font-size: 14px;
    white-space: nowrap;
  }

  .track {
    flex: 1 1 auto;
    display: flex;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
    scrollbar-color: var(--panel-edge) transparent;
    cursor: grab;
    user-select: none;
  }
  .track.dragging { cursor: grabbing; }
  .track::-webkit-scrollbar { height: 8px; }
  .track::-webkit-scrollbar-track { background: transparent; }
  .track::-webkit-scrollbar-thumb { background: var(--panel-edge); border-radius: 4px; }

  .panel {
    flex: 0 0 min(78vw, 620px);
    scroll-snap-align: center;
    display: flex;
    flex-direction: column;
    margin: clamp(16px, 3vw, 28px) 10px;
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 6px;
    overflow: hidden;
  }
  .panel:first-child { margin-left: clamp(20px, 4vw, 44px); }
  .panel:last-child { margin-right: clamp(20px, 4vw, 44px); }

  .frame {
    flex: 1 1 auto;
    position: relative;
    min-height: 0;
  }
  .frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
  }
  .placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      repeating-linear-gradient(135deg, transparent, transparent 18px, rgba(255,255,255,0.03) 18px, rgba(255,255,255,0.03) 36px),
      linear-gradient(160deg, #232b2e, #171c1e);
  }
  .placeholder span {
    font-family: 'Fraunces', serif;
    font-size: 15px;
    color: var(--ink-dim);
    border: 1px solid var(--panel-edge);
    padding: 8px 16px;
    border-radius: 100px;
    background: rgba(0,0,0,0.2);
  }

  .caption {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 14px 18px;
    border-top: 1px solid var(--panel-edge);
  }
  .caption .label {
    font-size: 14px;
    color: var(--ink);
  }
  .caption .idx {
    flex: 0 0 auto;
    font-size: 12px;
    color: var(--amber);
    font-variant-numeric: tabular-nums;
  }

  nav.controls {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 6px 0 18px;
  }
  nav.controls button {
    appearance: none;
    border: 1px solid var(--panel-edge);
    background: var(--panel);
    color: var(--ink);
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: border-color 0.15s ease, transform 0.1s ease;
  }
  nav.controls button:hover { border-color: var(--teal); }
  nav.controls button:active { transform: scale(0.94); }
  nav.controls button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  nav.controls svg { width: 16px; height: 16px; }

  .dots {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .dots button {
    appearance: none;
    border: none;
    background: var(--panel-edge);
    width: 6px;
    height: 6px;
    border-radius: 50%;
    padding: 0;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .dots button.active {
    background: var(--amber);
    transform: scale(1.5);
  }

  @media (prefers-reduced-motion: reduce) {
    .track { scroll-behavior: auto; }
  }
  @media not (prefers-reduced-motion: reduce) {
    .track { scroll-behavior: smooth; }
  }

  @media (max-width: 640px) {
    .panel { flex-basis: 84vw; }
    nav.controls { display: none; }
  }
</style>
</head>

    <button id="prevBtn" aria-label="Previous image">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <div class="dots" id="dots"></div>
    <button id="nextBtn" aria-label="Next image">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </button>

<script>
(function () {
  var track = document.getElementById('track');
  var panels = Array.prototype.slice.call(track.querySelectorAll('.panel'));
  var dotsWrap = document.getElementById('dots');
  var curIdx = document.getElementById('curIdx');
  var totalIdx = document.getElementById('totalIdx');
  totalIdx.textContent = panels.length;

  panels.forEach(function (p, i) {
    var d = document.createElement('button');
    d.setAttribute('aria-label', 'Go to image ' + (i + 1));
    if (i === 0) d.classList.add('active');
    d.addEventListener('click', function () { scrollToPanel(i); });
    dotsWrap.appendChild(d);
  });
  var dots = Array.prototype.slice.call(dotsWrap.children);

  function scrollToPanel(i) {
    i = Math.max(0, Math.min(panels.length - 1, i));
    panels[i].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
  }

  function currentIndex() {
    var center = track.scrollLeft + track.clientWidth / 2;
    var best = 0, bestDist = Infinity;
    panels.forEach(function (p, i) {
      var pc = p.offsetLeft + p.offsetWidth / 2;
      var dist = Math.abs(pc - center);
      if (dist < bestDist) { bestDist = dist; best = i; }
    });
    return best;
  }

  function updateActive() {
    var i = currentIndex();
    dots.forEach(function (d, di) { d.classList.toggle('active', di === i); });
    curIdx.textContent = i + 1;
  }

  var scrollTimer;
  track.addEventListener('scroll', function () {
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(updateActive, 60);
  }, { passive: true });

  document.getElementById('prevBtn').addEventListener('click', function () {
    scrollToPanel(currentIndex() - 1);
  });
  document.getElementById('nextBtn').addEventListener('click', function () {
    scrollToPanel(currentIndex() + 1);
  });

  // vertical wheel -> horizontal scroll, so a trackpad/mouse wheel works naturally
  track.addEventListener('wheel', function (e) {
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
      e.preventDefault();
      track.scrollLeft += e.deltaY;
    }
  }, { passive: false });

  // drag-to-scroll with a mouse
  var isDown = false, startX = 0, startScroll = 0;
  track.addEventListener('mousedown', function (e) {
    isDown = true;
    track.classList.add('dragging');
    startX = e.pageX;
    startScroll = track.scrollLeft;
  });
  window.addEventListener('mouseup', function () {
    isDown = false;
    track.classList.remove('dragging');
  });
  window.addEventListener('mousemove', function (e) {
    if (!isDown) return;
    e.preventDefault();
    track.scrollLeft = startScroll - (e.pageX - startX);
  });

  // keyboard arrows
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') scrollToPanel(currentIndex() + 1);
    if (e.key === 'ArrowLeft') scrollToPanel(currentIndex() - 1);
  });
})();
</script>
